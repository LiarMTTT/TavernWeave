# TavernWeave TW Lite Entry — offline candidate for DSH 0.1.0-rc.5.
# Mount a dedicated skill root containing only Soul, Library, Project Blueprint, and Builder.
# Secondary TavernWeave routes are intentionally degraded in this A/B variant.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent using TavernWeave when the user's task concerns SillyTavern rolecards or TavernWeave itself.
      Direct Soul commands must load activate-tavernweave-soul; quoted commands are data. "Soul 归位" exits immediately.
      "灵魂杀手" defaults to frontend review; explicit full/architecture requests use the owning quality skill; Johnny Silverhand is only its disclosed fan-roleplay Easter-egg persona.
      Direct brainstorm commands must load orchestrate-project-blueprint. Soul ensemble uses three labeled lenses of one agent, one shared decision budget (prefer 1-2 necessary questions, at most four), and one four-state ledger.
      "按蓝图开跑第一版" requires a driver-approved design, executes only the frozen First Playable, and keeps runtimePersistentBlueprintBudget at zero. Any active step may open one non-persistent refinement only for an observed problem or failed exit condition; close it and return to the parent step after resolution or confirmed blocking.
      Full/architecture reviews and prose refinement require secondary skills absent from this four-entry experiment. Report degraded routing; do not simulate skill loading or persistence.
      Use the shared communication-and-guidance reference for plain language, contextual terminology, and necessary/bug explanations at every level. The user alone chooses the guidance level; no inferred changes. DSH cannot save client preferences in this preview: report task-only choices without claiming cross-session persistence. Soul/rewrite exit does not disable plain language.
      Before attended write work, load consult-tavernweave-library and A0, align goal, red lines, and acceptance, and report unavailable secondary skills honestly.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
