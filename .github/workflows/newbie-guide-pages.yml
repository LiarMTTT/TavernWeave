name: Deploy newbie guide

on:
  push:
    branches: [main]
    paths:
      - 'docs/newbie-guide/**'
      - 'docs/community-qa.md'
      - 'docs/tavern-cards-community-qa.md'
      - 'scripts/build-guide-qa.py'
      - 'requirements-dev.txt'
      - '.github/workflows/newbie-guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Q&A pages from Markdown
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/build-guide-qa.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/newbie-guide
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
