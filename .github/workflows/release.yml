name: package-release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Python helpers
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath ./skills -Filter *.py -File -Recurse
          foreach ($file in $files) {
            python -m py_compile $file.FullName
          }
      - name: Run bundled Python tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem -LiteralPath ./skills -Filter test_*.py -File -Recurse
          foreach ($test in $tests) {
            python $test.FullName
          }
      - name: Build validated plugin archive
        shell: pwsh
        run: |
          if (-not $env:GITHUB_REF_NAME.StartsWith('v')) {
            throw "Release ref must start with v: $env:GITHUB_REF_NAME"
          }
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/package-release.ps1 -ExpectedVersion $expectedVersion
      - uses: actions/upload-artifact@v6
        with:
          name: tavernweave-release
          path: |
            dist/*.zip
            dist/*.sha256
