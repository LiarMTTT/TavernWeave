name: validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate public boundary and skill structure
        shell: pwsh
        run: |
          $env:TW_BOARD_TEST_ROOT = Join-Path $env:RUNNER_TEMP "tw-board-tests"
          ./scripts/validate-release.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP "tw-release-tests")
      - name: Compile Python helpers
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath ./skills -Filter *.py -File -Recurse
          foreach ($file in $files) {
            python -m py_compile $file.FullName
          }
      - name: Run bundled Python tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem -LiteralPath ./skills -Filter test_*.py -File -Recurse
          foreach ($test in $tests) {
            python $test.FullName
          }
