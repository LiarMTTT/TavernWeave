name: validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate public boundary and skill structure
        shell: pwsh
        run: |
          $env:TW_BOARD_TEST_ROOT = Join-Path $env:RUNNER_TEMP "tw-board-tests"
          ./scripts/validate-release.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP "tw-release-tests")
      - name: Validate public boundary and skill structure (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:TW_BOARD_TEST_ROOT = Join-Path $env:RUNNER_TEMP "tw-board-tests-ps51"
          ./scripts/validate-release.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP "tw-release-tests-ps51")
      - name: Compile Python helpers
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath ./skills -Filter *.py -File -Recurse
          foreach ($file in $files) {
            python -m py_compile $file.FullName
          }
      - name: Run bundled Python tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem -LiteralPath ./skills -Filter test_*.py -File -Recurse
          foreach ($test in $tests) {
            python $test.FullName
          }
      - name: Test committed plugin packaging
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:TW_TEST_ROOT = Join-Path $env:RUNNER_TEMP "tw-plugin-tests"
          New-Item -ItemType Directory -Path $env:TW_TEST_ROOT -Force | Out-Null
          python -B tests/test_plugin_packages.py
          python -B tests/test_codex_skill_install.py

  portable-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check plugin packaging on Linux
        env:
          PYTHONUTF8: '1'
          TW_TEST_ROOT: ${{ runner.temp }}/tw-plugin-tests
        run: |
          mkdir -p "$TW_TEST_ROOT"
          python -B tests/test_plugin_packages.py
          # The unchanged upstream packager describes the 23-skill base only.
          base_ref=$(python -c 'import json; print(json.load(open("extensions/yuri-creation/UPSTREAM.json"))["tavernweave"]["commit"])')
          python -B scripts/build-plugin-packages.py --repo "$GITHUB_WORKSPACE" --ref "$base_ref" --output-dir "$RUNNER_TEMP/plugin-packages"
      - name: Check complete Yuri distributions and Gemini CLI entries
        run: |
          node --test tests/gemini-extension.test.mjs
          python -B extensions/yuri-creation/scripts/build_host_plugin.py --repo . --ref HEAD --output "$RUNNER_TEMP/yuri-portable"
          python -B extensions/yuri-creation/scripts/build_host_plugin.py --repo . --ref HEAD --host gemini --output "$RUNNER_TEMP/yuri-gemini"
      - name: Check supported Yuri custom policies
        run: python -B -m unittest discover -s extensions/yuri-creation/tests -p 'test_profiles.py' -v
      - name: Check Codex skills-only installation
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          TW_TEST_ROOT: ${{ runner.temp }}/tw-codex-install-tests
        run: |
          mkdir -p "$TW_TEST_ROOT"
          python -B tests/test_codex_skill_install.py
          node --test tests/codex-skill-distribution.test.mjs
      - name: Validate the DeepSeek Harness plugin bundle
        run: node scripts/build-dsh-plugin.mjs --check
      - name: Check Antigravity packaging and persistence on Linux
        run: |
          node scripts/build-antigravity-plugin.mjs --check
          node --test tests/antigravity-plugin.test.mjs tests/antigravity-persistence.test.mjs
          node --test skills/consult-tavernweave-library/tests/guidance-preference.test.mjs skills/rewrite-natural-prose/tests/policy.test.mjs
      - name: Exercise bundled helpers on Linux
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          TW_TEST_ROOT: ${{ runner.temp }}/tw-plugin-helpers
        run: |
          mkdir -p "$TW_TEST_ROOT"
          node skills/consult-tavernweave-library/scripts/query-library.mjs --skill tavern-card-builder --intent "rolecard" --limit 1
          python -B skills/build-work-library/tests/test_work_library.py
