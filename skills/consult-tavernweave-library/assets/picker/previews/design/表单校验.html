<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · :invalid 与 :user-invalid</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px; }
    p.copy { font-size: 13px; line-height: 1.55; max-width: 46em; margin: 0 0 14px; }
    code { font-size: 12px; color: #7eb8ff; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    fieldset {
      flex: 1 1 220px;
      margin: 0;
      border: 1px solid #3a404c;
      background: #1a1d26;
      padding: 12px 14px 16px;
    }
    legend { font-size: 13px; padding: 0 6px; }
    label { display: block; font-size: 13px; margin: 0 0 8px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 14px; }
    input.a:invalid { outline: 2px solid #b42318; }
    input.b:user-invalid { outline: 2px solid #b42318; }
    button { margin-top: 10px; font-size: 13px; padding: 4px 10px; }
  </style>
</head>
<body>
  <main>
    <p class="copy">同一 <code>required</code> email：A 用 <code>:invalid</code>，空值一加载就红；B 用 <code>:user-invalid</code>，要等人输入或碰过才红。APG combobox ≠ 这个原生 input，本页只演示伪类。表单 <code>action</code> 为空、不提交外网。这不是已采用皮肤。</p>
    <div class="row">
      <fieldset>
        <legend>A · :invalid</legend>
        <form action="" method="get" onsubmit="return false">
          <label>邮箱 <input class="a" type="email" required name="a" autocomplete="off" /></label>
          <button type="submit">试提交（停在本页）</button>
        </form>
      </fieldset>
      <fieldset>
        <legend>B · :user-invalid</legend>
        <form action="" method="get" onsubmit="return false">
          <label>邮箱 <input class="b" type="email" required name="b" autocomplete="off" /></label>
          <button type="submit">试提交（停在本页）</button>
        </form>
      </fieldset>
    </div>
  </main>
</body>
</html>
