<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 虚拟列表</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p.copy { font-size: 13px; line-height: 1.55; max-width: 46em; margin: 0 0 12px; }
    code { font-size: 12px; color: #7eb8ff; }
    #port { height: 280px; overflow: auto; border: 1px solid #3a404c; background: #1a1d26; }
    #space { position: relative; }
    .row {
      position: absolute; left: 0; right: 0;
      display: grid; grid-template-columns: 3em 1fr;
      padding: 0 12px; align-items: center;
      box-sizing: border-box; font-size: 13px;
      border-bottom: 1px solid #2a303a;
    }
    #meta { margin-top: 8px; font-size: 12px; color: #9aa3b2; }
  </style>
</head>
<body>
  <main>
    <p class="copy">2000 行只画窗口里那几条。坐标器用 <code>translate</code> 绝对定位，不是 TanStack 组件，也不是把 2000 个 DOM 全铺出来。这不是已采用列表。</p>
    <div id="port"><div id="space"></div></div>
    <p id="meta"></p>
  </main>
  <script>
    const TOTAL = 2000, H = 32;
    const port = document.getElementById("port");
    const space = document.getElementById("space");
    const meta = document.getElementById("meta");
    space.style.height = TOTAL * H + "px";
    const pool = [];
    function row() {
      const el = document.createElement("div");
      el.className = "row";
      el.style.height = H + "px";
      space.appendChild(el);
      pool.push(el);
      return el;
    }
    function paint() {
      const start = Math.max(0, Math.floor(port.scrollTop / H) - 4);
      const end = Math.min(TOTAL, start + Math.ceil(port.clientHeight / H) + 8);
      while (pool.length < end - start) row();
      pool.forEach((el, i) => {
        const idx = start + i;
        if (idx >= end) { el.style.display = "none"; return; }
        el.style.display = "grid";
        el.style.transform = "translateY(" + idx * H + "px)";
        el.textContent = "";
        el.appendChild(document.createTextNode(String(idx + 1).padStart(4, "0")));
        const name = document.createElement("span");
        name.textContent = "行 " + (idx + 1);
        el.appendChild(name);
      });
      meta.textContent = "DOM 节点 " + pool.length + " · 窗口 " + start + "–" + (end - 1);
    }
    port.addEventListener("scroll", paint, { passive: true });
    paint();
  </script>
</body>
</html>
