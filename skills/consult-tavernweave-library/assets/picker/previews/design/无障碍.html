<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 焦点 / 对比 / 减动效</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p.copy { font-size: 13px; line-height: 1.55; max-width: 46em; margin: 0 0 14px; }
    code { font-size: 12px; color: #7eb8ff; }
    section { margin: 0 0 18px; }
    h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button {
      background: #232833; color: inherit; border: 1px solid #3a404c;
      border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer;
    }
    .bare:focus { outline: none; }
    .ring:focus-visible { outline: 3px solid #ffd60a; outline-offset: 3px; }
    .swatch { width: 88px; height: 56px; display: grid; place-items: center; font-size: 12px; }
    .fail { background: #777; color: #9a9a9a; }
    .pass { background: #1a1d26; color: #f2f4f8; }
    .dot {
      width: 22px; height: 22px; border-radius: 50%; background: #7eb8ff;
      animation: hop 1.2s ease-in-out infinite alternate;
    }
    @keyframes hop { to { transform: translateX(120px); } }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; transform: translateX(60px); }
    }
    body.reduce .dot { animation: none; transform: translateX(60px); }
  </style>
</head>
<body>
  <main>
    <p class="copy">三件真 CSS：无描边的焦点、 <code>:focus-visible</code> 黄环、对比失败对 vs 能读的对。减动效用系统 <code>prefers-reduced-motion</code>，也可按按钮强制停。这不是 WCAG 符合性证明，也不是已采用皮肤。</p>
    <section>
      <h2>焦点</h2>
      <div class="row">
        <button class="bare" type="button">无描边 · Tab 过来看不见</button>
        <button class="ring" type="button">:focus-visible 黄环</button>
      </div>
    </section>
    <section>
      <h2>对比</h2>
      <div class="row">
        <div class="swatch fail">#777 / #9a9a9a</div>
        <div class="swatch pass">深底浅字</div>
      </div>
    </section>
    <section>
      <h2>减动效</h2>
      <div class="row">
        <div class="dot" aria-hidden="true"></div>
        <button type="button" id="rm">强制停动画</button>
      </div>
    </section>
  </main>
  <script>
    document.getElementById("rm").addEventListener("click", () => {
      document.body.classList.toggle("reduce");
    });
  </script>
</body>
</html>
