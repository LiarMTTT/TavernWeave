<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 自定义元素</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p.copy { font-size: 13px; line-height: 1.55; max-width: 46em; margin: 0 0 14px; }
    code { font-size: 12px; color: #7eb8ff; }
    form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button { background: #232833; color: inherit; border: 1px solid #3a404c; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
    output { font-size: 13px; }
    afv-stepper { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid #3a404c; background: #1a1d26; }
  </style>
</head>
<body>
  <main>
    <p class="copy">原生 <code>customElements</code>。表单里的步进器若支持 <code>ElementInternals</code> 会把值交给 form；不支持就只改文本。不是 Lit 文档站，也不是已采用组件库。</p>
    <form id="f">
      <afv-stepper name="n" value="2"></afv-stepper>
      <button type="submit">读表单</button>
      <output id="out"></output>
    </form>
  </main>
  <script>
    class AfvStepper extends HTMLElement {
      static formAssociated = true;
      constructor() {
        super();
        this._v = 0;
        try { this._i = this.attachInternals(); } catch { this._i = null; }
      }
      connectedCallback() {
        this._v = Number(this.getAttribute("value") || 0);
        this.innerHTML = "<button type='button' data-d>-</button><span></span><button type='button' data-u>+</button>";
        this.addEventListener("click", (event) => {
          if (event.target.dataset.d) this._v -= 1;
          if (event.target.dataset.u) this._v += 1;
          this._paint();
        });
        this._paint();
      }
      _paint() {
        this.querySelector("span").textContent = String(this._v);
        if (this._i) this._i.setFormValue(String(this._v));
        this.setAttribute("value", String(this._v));
      }
    }
    customElements.define("afv-stepper", AfvStepper);
    document.getElementById("f").addEventListener("submit", (event) => {
      event.preventDefault();
      const fd = new FormData(event.currentTarget);
      const fallback = document.querySelector("afv-stepper").getAttribute("value");
      document.getElementById("out").textContent = "FormData n=" + (fd.get("n") ?? "（无 internals）") + " · attr=" + fallback;
    });
  </script>
</body>
</html>
