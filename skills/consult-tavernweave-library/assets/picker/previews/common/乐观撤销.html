<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 乐观 / 撤销</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; margin-right: 6px; }
    .st { font-size: 18px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>乐观回滚是单步快照；撤销栈是多层命令史。左边假提交，右边真撤销。不是 React <code>useOptimistic</code>，不是已采用状态栈。</p>
    <p class="st" id="st">0</p>
    <button type="button" id="opt">乐观 +1</button>
    <button type="button" id="undo">撤销</button>
  </main>
  <script>
    let value = 0;
    const hist = [];
    const st = document.getElementById("st");
    document.getElementById("opt").addEventListener("click", () => {
      hist.push(value);
      value += 1;
      st.textContent = value + " · 已乐观";
      setTimeout(() => { st.textContent = String(value); }, 400);
    });
    document.getElementById("undo").addEventListener("click", () => {
      if (!hist.length) return;
      value = hist.pop();
      st.textContent = String(value);
    });
  </script>
</body>
</html>
