<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · WebGPU 清屏</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p, .st { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    canvas { display: block; width: min(360px, 100%); height: 180px; background: #1a1d26; border-radius: 8px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>只做一次清屏。有 <code>gpu.requestAdapter</code> 就走 WebGPU；没有就用 2D canvas 涂同色。这<strong>不是</strong> Three / R3F / Babylon，也不是已采用 3D 栈。</p>
    <p class="st" id="st">检测中</p>
    <canvas id="c" width="360" height="180"></canvas>
  </main>
  <script>
    const st = document.getElementById("st");
    const canvas = document.getElementById("c");
    async function gpu() {
      if (!navigator.gpu) return false;
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return false;
      const device = await adapter.requestDevice();
      const ctx = canvas.getContext("webgpu");
      if (!ctx) return false;
      ctx.configure({ device, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: "opaque" });
      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({
        colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0.91, g: 0.72, b: 0.43, a: 1 }, loadOp: "clear", storeOp: "store" }]
      });
      pass.end();
      device.queue.submit([enc.finish()]);
      st.textContent = "WebGPU 清屏成功。没有着色器、没有网格。";
      return true;
    }
    gpu().then((ok) => {
      if (ok) return;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#e8b86d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      st.textContent = "没有 WebGPU，2D canvas 涂了同色。";
    });
  </script>
</body>
</html>
