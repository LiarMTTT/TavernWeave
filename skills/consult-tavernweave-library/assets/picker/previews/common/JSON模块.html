<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · JSON 模块</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>导入属性 <code>with { type: "json" }</code>。这<strong>不是</strong> HTML import maps。点了才动态 import 一个 blob。不是已采用模块栈。</p>
    <button type="button" id="go">import JSON</button>
    <p class="st" id="st"></p>
  </main>
  <script type="module">
    document.getElementById("go").addEventListener("click", async () => {
      const st = document.getElementById("st");
      const url = URL.createObjectURL(new Blob(['{"ok":true}'], { type: "application/json" }));
      try {
        const mod = await import(url, { with: { type: "json" } });
        st.textContent = "with type=json · " + JSON.stringify(mod.default);
      } catch (err) {
        st.textContent = "导入属性失败：" + err.message;
      } finally {
        URL.revokeObjectURL(url);
      }
    });
  </script>
</body>
</html>
