<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · Worker 消息</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>Dedicated Worker 来回一条。这<strong>不是</strong> SharedWorker，也不是 Service Worker。不是已采用线程栈。</p>
    <button type="button" id="go">ping</button>
    <p class="st" id="st">还没 ping。</p>
  </main>
  <script>
    const src = URL.createObjectURL(new Blob(["onmessage=e=>postMessage('pong '+e.data)"], { type: "text/javascript" }));
    const worker = new Worker(src);
    worker.onmessage = (e) => { document.getElementById("st").textContent = e.data; };
    document.getElementById("go").addEventListener("click", () => worker.postMessage(String(Date.now())));
  </script>
</body>
</html>
