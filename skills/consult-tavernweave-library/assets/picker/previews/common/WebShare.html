<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · Web Share</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>navigator.share</code> 是发起分享。这<strong>不是</strong> Share Target（被分享方清单）。桌面常没有。不是已采用分享栈。</p>
    <button type="button" id="go">分享这段字</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    const st = document.getElementById("st");
    document.getElementById("go").addEventListener("click", async () => {
      if (!navigator.share) {
        st.textContent = "没有 Web Share。";
        return;
      }
      try {
        await navigator.share({ title: "样本册", text: "这不是已采用。" });
        st.textContent = "已唤起系统分享。";
      } catch (err) {
        st.textContent = err.name === "AbortError" ? "取消了。" : String(err.message);
      }
    });
  </script>
</body>
</html>
