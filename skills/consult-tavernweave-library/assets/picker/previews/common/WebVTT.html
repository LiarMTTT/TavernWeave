<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · WebVTT</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    video { display: block; width: min(360px, 100%); background: #000; border-radius: 8px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>空视频 + blob <code>text/vtt</code> 轨。这是 WebVTT，<strong>不是</strong> TTML / IMSC。没有片源，只看轨能不能挂上。不是已采用字幕栈。</p>
    <video id="v" controls muted></video>
    <p class="st" id="st"></p>
  </main>
  <script>
    const vtt = "WEBVTT\n\n00:00:00.000 --> 00:00:02.000\n第一条\n\n00:00:02.000 --> 00:00:04.000\n第二条";
    const video = document.getElementById("v");
    const track = document.createElement("track");
    track.kind = "subtitles";
    track.label = "zh";
    track.srclang = "zh";
    track.default = true;
    track.src = URL.createObjectURL(new Blob([vtt], { type: "text/vtt" }));
    video.appendChild(track);
    track.addEventListener("load", () => {
      document.getElementById("st").textContent = "轨已载 · cues " + (track.track && track.track.cues ? track.track.cues.length : 0);
    });
    document.getElementById("st").textContent = "轨已挂上。没有片源，时间轴是空的。";
  </script>
</body>
</html>
