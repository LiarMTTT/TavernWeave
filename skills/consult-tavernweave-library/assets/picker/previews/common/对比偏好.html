<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 对比偏好</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .card { padding: 12px; border-radius: 8px; background: #2a2f3a; color: #9aa3b2; }
    @media (prefers-contrast: more) { .card { background: #000; color: #fff; outline: 2px solid #fff; } }
    @media (prefers-contrast: less) { .card { background: #3a3f4a; color: #c5c9d2; } }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>MQ5 用 <code>more / less / custom</code>，不要引 2020 的 high/low。这不是色觉诊断，也不是已采用主题。</p>
    <div class="card">对比偏好会改这张卡。</div>
    <p class="st" id="st"></p>
  </main>
  <script>
    const q = (v) => matchMedia("(prefers-contrast: " + v + ")").matches;
    document.getElementById("st").textContent = q("more") ? "more" : q("less") ? "less" : q("custom") ? "custom" : "无对比偏好 / 不支持该查询";
  </script>
</body>
</html>
