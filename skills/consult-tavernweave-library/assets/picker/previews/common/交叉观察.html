<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 交叉观察</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .box { height: 120px; overflow: auto; background: #1a1d26; border-radius: 8px; }
    .item { height: 80px; margin: 8px; background: #232833; border-radius: 6px; padding: 8px; }
    .item.on { outline: 2px solid #e8b86d; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>IntersectionObserver</code>。Resize 的 TR 停在 2020 FPWD，现行在 CSSWG。不是已采用观察栈。</p>
    <div class="box" id="box">
      <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
    </div>
    <p class="st" id="st">滚动小盒</p>
  </main>
  <script>
    const st = document.getElementById("st");
    const io = new IntersectionObserver((ents) => {
      ents.forEach((e) => e.target.classList.toggle("on", e.isIntersecting));
      st.textContent = "可见 " + document.querySelectorAll(".item.on").length;
    }, { root: document.getElementById("box"), threshold: 0.6 });
    document.querySelectorAll(".item").forEach((n) => io.observe(n));
  </script>
</body>
</html>
