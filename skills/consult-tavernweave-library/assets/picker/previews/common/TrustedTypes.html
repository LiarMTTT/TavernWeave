<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · Trusted Types</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    #slot { margin-top: 10px; padding: 10px; background: #1a1d26; border-radius: 8px; min-height: 2em; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>有 <code>trustedTypes</code> 就建策略再写 HTML。本页<strong>没有</strong>强制 CSP，所以这只是 API 探测，不是完整 CSP 合同。TT ≠ SRI ≠ Permissions-Policy。不是已采用安全栈。</p>
    <button type="button" id="go">写入一段</button>
    <div id="slot"></div>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("go").addEventListener("click", () => {
      const slot = document.getElementById("slot");
      const st = document.getElementById("st");
      const html = "<strong>策略写进来的字</strong>";
      if (window.trustedTypes && trustedTypes.createPolicy) {
        const policy = trustedTypes.createPolicy("afv-preview", { createHTML: (s) => s });
        slot.innerHTML = policy.createHTML(html);
        st.textContent = "走了 Trusted Types 策略。";
      } else {
        slot.textContent = "没有 Trusted Types，只写文本节点。";
        st.textContent = "API 不存在。";
      }
    });
  </script>
</body>
</html>
