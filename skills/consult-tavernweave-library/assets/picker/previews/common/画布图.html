<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 画布图</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    canvas { display: block; background: #1a1d26; border-radius: 8px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>手写 Canvas 柱。这<strong>不是</strong> D3 / ECharts。不是已采用可视化栈。</p>
    <canvas id="c" width="360" height="160"></canvas>
  </main>
  <script>
    const ctx = document.getElementById("c").getContext("2d");
    const vals = [12, 28, 19, 34, 22];
    vals.forEach((v, i) => {
      ctx.fillStyle = i % 2 ? "#e8b86d" : "#7eb8ff";
      ctx.fillRect(24 + i * 64, 140 - v * 3, 40, v * 3);
    });
  </script>
</body>
</html>
