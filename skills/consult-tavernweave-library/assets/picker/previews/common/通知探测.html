<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 通知探测</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>Push / Notifications / VAPID / Badging 是四件事。这里只问 <code>Notification</code> 权限，不接推送服务。不是已采用推送栈。</p>
    <button type="button" id="go">查并请求通知</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    const st = document.getElementById("st");
    st.textContent = window.Notification ? "permission=" + Notification.permission : "没有 Notification。";
    document.getElementById("go").addEventListener("click", async () => {
      if (!window.Notification) return;
      const perm = await Notification.requestPermission();
      st.textContent = "permission=" + perm + " · serviceWorker " + Boolean(navigator.serviceWorker) + " · setAppBadge " + Boolean(navigator.setAppBadge);
    });
  </script>
</body>
</html>
