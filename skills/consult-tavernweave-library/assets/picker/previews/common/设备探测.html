<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 设备探测</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    pre { background: #1a1d26; padding: 10px; border-radius: 8px; font-size: 12px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>HID / USB / Serial 三份 WICG，<code>/TR</code> 常 404。只报 <code>navigator</code> 上有没有入口，<strong>不</strong>请求设备。不是已采用外设栈。</p>
    <pre id="out"></pre>
  </main>
  <script>
    document.getElementById("out").textContent = [
      "hid " + Boolean(navigator.hid),
      "usb " + Boolean(navigator.usb),
      "serial " + Boolean(navigator.serial)
    ].join("\n");
  </script>
</body>
</html>
