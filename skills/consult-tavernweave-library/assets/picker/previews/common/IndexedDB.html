<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · IndexedDB</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; margin-right: 6px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>本源 <code>IndexedDB</code> 写一条再读回来。短名规范阶段以打开页为准，这里只跑实现。不是已采用存储栈。</p>
    <button type="button" id="put">写入</button>
    <button type="button" id="get">读出</button>
    <p class="st" id="st">还没动。</p>
  </main>
  <script>
    const st = document.getElementById("st");
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("afv-preview-idb", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    document.getElementById("put").addEventListener("click", async () => {
      const db = await openDb();
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put({ t: Date.now() }, "demo");
      tx.oncomplete = () => { st.textContent = "已写入 demo。"; db.close(); };
    });
    document.getElementById("get").addEventListener("click", async () => {
      const db = await openDb();
      const tx = db.transaction("kv", "readonly");
      const req = tx.objectStore("kv").get("demo");
      req.onsuccess = () => {
        st.textContent = req.result ? "读到 t=" + req.result.t : "还没有这条。";
        db.close();
      };
    });
  </script>
</body>
</html>
