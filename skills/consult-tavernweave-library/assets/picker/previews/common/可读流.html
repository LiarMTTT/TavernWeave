<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 可读流</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    pre { background: #1a1d26; padding: 10px; border-radius: 8px; font-size: 12px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>WHATWG <code>ReadableStream</code>。W3C 2016 Note 已停，短名 <code>/TR/streams/</code> 不要当活页。不是 Fetch body 教程站，不是已采用传输栈。</p>
    <button type="button" id="go">拉三块</button>
    <pre id="out">还没拉。</pre>
  </main>
  <script>
    document.getElementById("go").addEventListener("click", async () => {
      let n = 0;
      const stream = new ReadableStream({
        pull(ctrl) {
          n += 1;
          ctrl.enqueue("块 " + n);
          if (n >= 3) ctrl.close();
        }
      });
      const reader = stream.getReader();
      const bits = [];
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        bits.push(value);
      }
      document.getElementById("out").textContent = bits.join("\n");
    });
  </script>
</body>
</html>
