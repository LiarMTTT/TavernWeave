<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 振动 / 手柄</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>navigator.vibrate</code> 实现面已收缩。手柄走 <code>navigator.getGamepads</code>。Extensions 与主 WD 触觉模型冲突，这里只探测。不是已采用外设栈。</p>
    <button type="button" id="buzz">振 200ms</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    const st = document.getElementById("st");
    const pads = () => [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean);
    st.textContent = (navigator.vibrate ? "有 vibrate。" : "没有 vibrate。") + " 手柄 " + pads().length;
    document.getElementById("buzz").addEventListener("click", () => {
      const ok = navigator.vibrate && navigator.vibrate(200);
      st.textContent = ok ? "已请求振动。" : "被拒或无实现。手柄 " + pads().length;
    });
  </script>
</body>
</html>
