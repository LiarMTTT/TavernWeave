<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 状态机</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; margin-right: 6px; }
    .st { font-size: 18px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>三态手写表：idle → open → done。这是 FSM，<strong>不是</strong> XState / SCXML。不是已采用状态栈。</p>
    <p class="st" id="st">idle</p>
    <button type="button" data-e="open">open</button>
    <button type="button" data-e="done">done</button>
    <button type="button" data-e="reset">reset</button>
  </main>
  <script>
    const table = { idle: { open: "open" }, open: { done: "done" }, done: { reset: "idle" } };
    let state = "idle";
    const st = document.getElementById("st");
    document.querySelectorAll("[data-e]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state = (table[state] && table[state][btn.dataset.e]) || state;
        st.textContent = state;
      });
    });
  </script>
</body>
</html>
