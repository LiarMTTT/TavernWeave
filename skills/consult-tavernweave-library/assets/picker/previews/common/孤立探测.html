<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 孤立上下文</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>Isolated Contexts / IWA 是安装面，不是普通 https 页。本页只读安全与隔离旗标。不是已采用 IWA。</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent =
      "isSecureContext=" + window.isSecureContext +
      " · crossOriginIsolated=" + window.crossOriginIsolated +
      " · isolatedContext=" + String(window.isolatedContext ?? "无此字段");
  </script>
</body>
</html>
