<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · UA Client Hints</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    pre { background: #1a1d26; padding: 10px; border-radius: 8px; font-size: 12px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>UA-CH <strong>不是</strong>「User-Agent 字符串已死」。只读 <code>navigator.userAgentData</code> 低熵字段。不是已采用指纹方案。</p>
    <pre id="out"></pre>
  </main>
  <script>
    const ua = navigator.userAgentData;
    document.getElementById("out").textContent = ua
      ? JSON.stringify({ brands: ua.brands, mobile: ua.mobile, platform: ua.platform }, null, 2)
      : "没有 userAgentData。\nUA 长度 " + navigator.userAgent.length;
  </script>
</body>
</html>
