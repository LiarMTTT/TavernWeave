<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · Web Locks</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>navigator.locks.request</code> 拿一把再放。这<strong>不是</strong> SharedWorker，也不是 BroadcastChannel。不是已采用锁栈。</p>
    <button type="button" id="go">拿锁 800ms</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("go").addEventListener("click", async () => {
      const st = document.getElementById("st");
      if (!navigator.locks) {
        st.textContent = "没有 Web Locks。";
        return;
      }
      st.textContent = "请求中…";
      await navigator.locks.request("afv-preview", async () => {
        const held = await navigator.locks.query();
        st.textContent = "持有 " + held.held.map((x) => x.name).join(", ") + " · 800ms";
        await new Promise((r) => setTimeout(r, 800));
      });
      st.textContent = "已释放。";
    });
  </script>
</body>
</html>
