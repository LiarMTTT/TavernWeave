<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 流体字</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .fluid { margin: 12px 0; font-size: clamp(18px, 4vw + 8px, 48px); line-height: 1.2; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>clamp(18px, 4vw + 8px, 48px)</code>。拉窄这只 iframe 看字号跟视口走。这是平台函数，<strong>不是</strong> Utopia 生成器镜像，也不是已采用字阶。</p>
    <p class="fluid" id="s">流体标题</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    const s = document.getElementById("s");
    const st = document.getElementById("st");
    const tick = () => { st.textContent = "计算字号 " + Math.round(parseFloat(getComputedStyle(s).fontSize)) + "px"; };
    tick();
    new ResizeObserver(tick).observe(document.documentElement);
  </script>
</body>
</html>
