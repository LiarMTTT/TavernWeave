<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · CSS 函数</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .box { width: 160px; height: 80px; border-radius: 8px; background: #3d6aa3; }
    @supports (background: if(style(--on: 1): #e8b86d; else: #3d6aa3)) {
      .box { background: if(style(--on: 1): #e8b86d; else: #3d6aa3); }
    }
    button { margin-top: 10px; background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>试 <code>if()</code> 样式查询。没有这层就只切换自定义属性，不假装有 <code>@function</code>。不是已采用 CSS 2026 清单。</p>
    <div class="box" id="box"></div>
    <button type="button" id="tog">切换 --on</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    const box = document.getElementById("box");
    let on = false;
    document.getElementById("tog").addEventListener("click", () => {
      on = !on;
      box.style.setProperty("--on", on ? "1" : "0");
      if (!CSS.supports("background", "if(style(--on: 1): #e8b86d; else: #3d6aa3)")) {
        box.style.background = on ? "#e8b86d" : "#3d6aa3";
      }
    });
    document.getElementById("st").textContent = CSS.supports("background", "if(style(--on: 1): #e8b86d; else: #3d6aa3)")
      ? "这只浏览器认 if()。"
      : "没有 if()，按钮只改背景色当对照。";
  </script>
</body>
</html>
