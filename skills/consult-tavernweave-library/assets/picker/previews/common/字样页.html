<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 字样页</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .row { margin: 14px 0; padding: 10px 12px; background: #1a1d26; border-radius: 8px; }
    .row h2 { margin: 0 0 6px; font-size: 12px; color: #9aa3b2; font-weight: 600; }
    .row p { margin: 0; font-size: 22px; line-height: 1.4; }
    .serif { font-family: "Iowan Old Style", Palatino, "Songti SC", serif; }
    .sans { font-family: "Segoe UI", "PingFang SC", sans-serif; }
    .mono { font-family: Consolas, "Cascadia Mono", monospace; }
  </style>
</head>
<body>
  <main>
    <p>系统字对照。没有随库分发的商用字，<strong>不</strong>嵌字厂站，也不假装这是样本册已采用字单。</p>
    <div class="row serif"><h2>衬线</h2><p>汉字与 Latin 对照 · 2026</p></div>
    <div class="row sans"><h2>无衬线</h2><p>汉字与 Latin 对照 · 2026</p></div>
    <div class="row mono"><h2>等宽</h2><p>汉字与 Latin 对照 · 2026</p></div>
  </main>
</body>
</html>
