<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 截屏</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    video { display: block; width: min(360px, 100%); background: #000; border-radius: 8px; }
    button { margin-top: 8px; background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; margin-right: 6px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>getDisplayMedia</code>。Region / Element Capture 是另两套。点了才问权限，停就停轨。不是已采用采集栈。</p>
    <video id="v" autoplay muted></video>
    <button type="button" id="on">共享屏幕</button>
    <button type="button" id="off">停</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    let stream = null;
    const v = document.getElementById("v");
    const st = document.getElementById("st");
    document.getElementById("on").addEventListener("click", async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
          st.textContent = "没有 getDisplayMedia。";
          return;
        }
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        v.srcObject = stream;
        st.textContent = "已共享。这是整屏/窗口，不是 Element Capture。";
      } catch (err) { st.textContent = err.name === "NotAllowedError" ? "拒绝了。" : err.message; }
    });
    document.getElementById("off").addEventListener("click", () => {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = null;
      v.srcObject = null;
      st.textContent = "已停。";
    });
  </script>
</body>
</html>
