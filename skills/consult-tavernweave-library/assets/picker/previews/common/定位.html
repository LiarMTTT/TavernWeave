<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 定位</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>现行短名是 <code>geolocation</code>（CR），不是旧短名 <code>geolocation-API</code>。点了才问权限。坐标只显示精度，不落盘。不是已采用定位栈。</p>
    <button type="button" id="go">取一次位置</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("go").addEventListener("click", () => {
      const st = document.getElementById("st");
      if (!navigator.geolocation) {
        st.textContent = "没有 Geolocation。";
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          st.textContent = "精度约 " + Math.round(pos.coords.accuracy) + " m · " + pos.coords.latitude.toFixed(3) + ", " + pos.coords.longitude.toFixed(3);
        },
        (err) => { st.textContent = err.message; },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
