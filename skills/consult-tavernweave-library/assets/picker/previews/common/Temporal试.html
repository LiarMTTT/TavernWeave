<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · Temporal</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { font-size: 18px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>JS <code>Temporal</code> 是语言 API，尚未进 ECMA-262。这<strong>不是</strong> Temporal.io 工作流。没有对象就直说。不是已采用时间库。</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    const st = document.getElementById("st");
    if (globalThis.Temporal && Temporal.Now) {
      st.textContent = Temporal.Now.plainDateISO().toString() + " · " + Temporal.Now.plainTimeISO().toString().slice(0, 8);
    } else {
      st.textContent = "没有 Temporal。Date.now() = " + Date.now();
    }
  </script>
</body>
</html>
