<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 广色域</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .row { display: flex; gap: 10px; }
    .srgb, .p3 { width: 120px; height: 80px; border-radius: 8px; }
    .srgb { background: rgb(255, 0, 80); }
    .p3 { background: color(display-p3 1 0 0.25); }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>Display P3 是 SDR 宽色，<strong>不是</strong> HDR。左 sRGB，右 <code>color(display-p3 …)</code>。不是已采用色域栈。</p>
    <div class="row"><div class="srgb"></div><div class="p3"></div></div>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent = matchMedia("(color-gamut: p3)").matches
      ? "这屏报 color-gamut: p3。两块若几乎一样，说明管线没出 P3。"
      : "没有 p3 查询。右块可能被收成 sRGB。";
  </script>
</body>
</html>
