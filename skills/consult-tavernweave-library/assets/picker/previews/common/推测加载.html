<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 推测加载</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>推测加载在 HTML 活标准。RFC 8297 的 103 仍是 Experimental。Chrome 103 状态码 ≠ prefetch。只探测 <code>HTMLScriptElement.supports('speculationrules')</code>。不是已采用预渲染栈。</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent = HTMLScriptElement.supports
      ? "speculationrules " + HTMLScriptElement.supports("speculationrules")
      : "没有 HTMLScriptElement.supports。";
  </script>
</body>
</html>
