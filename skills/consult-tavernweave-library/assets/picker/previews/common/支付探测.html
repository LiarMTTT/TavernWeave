<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 支付探测</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>只探测 <code>PaymentRequest</code>。短链现为 CRD，不是 2022 Rec。<strong>不</strong>收卡号、不唤起付款。不是已采用支付栈。</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent = window.PaymentRequest
      ? "有 PaymentRequest 构造器。本沙盘不 new。"
      : "没有 PaymentRequest。";
  </script>
</body>
</html>
