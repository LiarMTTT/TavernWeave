<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · CSS 三维</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .stage { perspective: 640px; height: 180px; display: grid; place-items: center; }
    .card {
      width: 160px; height: 100px;
      transform-style: preserve-3d;
      animation: spin 4s linear infinite;
      background: #1a1d26;
      border: 1px solid #e8b86d;
      border-radius: 10px;
      display: grid; place-items: center;
    }
    @keyframes spin { to { transform: rotateY(360deg); } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>perspective</code> + <code>rotateY</code>。这是 CSS 三维，<strong>不是</strong> Three / R3F / Babylon。减动效时停转。不是已采用 3D 栈。</p>
    <div class="stage"><div class="card">CSS 3D</div></div>
  </main>
</body>
</html>
