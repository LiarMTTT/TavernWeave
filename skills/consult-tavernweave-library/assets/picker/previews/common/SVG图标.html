<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · SVG 图标</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    svg { width: 36px; height: 36px; margin-right: 10px; fill: #e8b86d; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>内联 SVG。这<strong>不是</strong> Lucide / Phosphor / Carbon / Fluent。Fluent 三套里只有 System Icons 是 MIT。不是已采用图标集。</p>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#7eb8ff" stroke-width="2"/></svg>
  </main>
</body>
</html>
