<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 权限查询</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    pre { background: #1a1d26; padding: 10px; border-radius: 8px; font-size: 12px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>navigator.permissions.query</code> 是注册表查询。这<strong>不是</strong> Permissions-Policy 头，也不是设备 API 各自的 token。不是已采用权限栈。</p>
    <button type="button" id="go">查 geolocation / notifications</button>
    <pre id="out">还没查。</pre>
  </main>
  <script>
    document.getElementById("go").addEventListener("click", async () => {
      const out = document.getElementById("out");
      if (!navigator.permissions || !navigator.permissions.query) {
        out.textContent = "没有 Permissions.query。";
        return;
      }
      const names = ["geolocation", "notifications"];
      const lines = [];
      for (const name of names) {
        try {
          const st = await navigator.permissions.query({ name });
          lines.push(name + " · " + st.state);
        } catch (err) {
          lines.push(name + " · " + err.message);
        }
      }
      out.textContent = lines.join("\n");
    });
  </script>
</body>
</html>
