<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · FedCM 探测</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>FedCM ≠ WebAuthn；Digital Credentials ≠ 通行密钥。只报构造器，<strong>不</strong>拉身份提供方。不是已采用登录栈。</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent =
      "IdentityCredential " + Boolean(window.IdentityCredential) +
      " · DigitalCredential " + Boolean(window.DigitalCredential) +
      " · PublicKeyCredential " + Boolean(window.PublicKeyCredential);
  </script>
</body>
</html>
