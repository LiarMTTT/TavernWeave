<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · @property</title>
  <style>
    @property --hue {
      syntax: "<number>";
      inherits: false;
      initial-value: 200;
    }
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p, .st { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    .swatch { width: 160px; height: 80px; border-radius: 8px; background: hsl(var(--hue) 50% 45%); transition: --hue 400ms linear; }
    button { margin-top: 10px; background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>Houdini 里只有 <code>@property</code> 是 Baseline 2024。Paint Worklet 只 Chromium，Animation Worklet 生产当死。这里只过渡登记过的 <code>--hue</code>。不是已采用 Houdini 栈。</p>
    <div class="swatch" id="sw"></div>
    <button type="button" id="go">换色相</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent = CSS.registerProperty
      ? "有 CSS.registerProperty / @property。"
      : "没有 @property，色块只会跳，不过渡自定义属性。";
    document.getElementById("go").addEventListener("click", () => {
      const next = 20 + Math.round(Math.random() * 300);
      document.getElementById("sw").style.setProperty("--hue", String(next));
    });
  </script>
</body>
</html>
