<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · FontFace 载入</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .sample { font-size: 28px; margin: 12px 0; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>new FontFace(..., "local('Segoe UI')")</code> 再 <code>document.fonts.add</code>。这是 JS 载入层，<strong>不是</strong> CSS <code>@font-face</code> 声明。不拉远程字。不是已采用字库。</p>
    <p class="sample" id="sample">FontFace 载入层</p>
    <button type="button" id="go">载入 local 字</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("go").addEventListener("click", async () => {
      const st = document.getElementById("st");
      try {
        const face = new FontFace("AFVLocal", "local('Segoe UI'), local('PingFang SC')");
        await face.load();
        document.fonts.add(face);
        document.getElementById("sample").style.fontFamily = "AFVLocal, sans-serif";
        st.textContent = "status=" + face.status + " · family=" + face.family;
      } catch (err) {
        st.textContent = "载入失败：" + err.message;
      }
    });
  </script>
</body>
</html>
