<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 跨源隔离</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>COOP ≠ COEP ≠ CORP。<code>same-origin-plus-COEP</code> 不能当头写。本页只读 <code>crossOriginIsolated</code>，不改响应头。不是已采用隔离栈。</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent =
      "crossOriginIsolated=" + String(window.crossOriginIsolated) +
      " · isSecureContext=" + String(window.isSecureContext);
  </script>
</body>
</html>
