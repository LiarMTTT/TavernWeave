<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 空状态</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .empty { padding: 20px; background: #1a1d26; border-radius: 8px; }
    .toast { margin-top: 10px; padding: 8px 10px; background: #232833; border-radius: 8px; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>空态在页里；字段错不要靠 Toast。NN/g 与 Carbon 对 Toast 超时意见不一致，两边都留。不是已采用反馈栈。</p>
    <div class="empty" id="empty">还没有条目。点下面加一条。</div>
    <p><button type="button" id="add">加一条</button></p>
    <div class="toast" id="toast" hidden>加好了。这是确认，不是字段错。</div>
  </main>
  <script>
    document.getElementById("add").addEventListener("click", () => {
      document.getElementById("empty").textContent = "条目 1";
      const t = document.getElementById("toast");
      t.hidden = false;
      setTimeout(() => { t.hidden = true; }, 1600);
    });
  </script>
</body>
</html>
