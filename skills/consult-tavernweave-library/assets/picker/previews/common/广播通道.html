<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 广播通道</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>BroadcastChannel</code> 是短暂在场，<strong>不</strong>入文档 CRDT。同页自己发自己收。不是 Durable Objects，不是已采用实时栈。</p>
    <button type="button" id="go">发一条</button>
    <p class="st" id="st">还没收到。</p>
  </main>
  <script>
    const ch = new BroadcastChannel("afv-preview");
    ch.onmessage = (e) => { document.getElementById("st").textContent = "收到 " + e.data; };
    document.getElementById("go").addEventListener("click", () => ch.postMessage(String(Date.now())));
  </script>
</body>
</html>
