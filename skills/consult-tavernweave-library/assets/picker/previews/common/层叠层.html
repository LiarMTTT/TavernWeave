<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 层叠层</title>
  <style>
    @layer base, override;
    @layer base { .box { background: #3d6aa3; color: #fff; } }
    @layer override { .box { background: #e8b86d; color: #12141a; } }
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .box { padding: 16px; border-radius: 8px; width: max-content; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>@layer base, override</code>。后声明的层盖住前一层，与选择器打分无关。<code>@scope</code> 仍在 Cascade 6 探索稿，这里不做。不是已采用层叠皮肤。</p>
    <div class="box">override 层应是暖色</div>
    <p class="st" id="st"></p>
  </main>
  <script>
    document.getElementById("st").textContent = CSS.supports("at-rule", "@layer") || CSS.supports("(color: red)")
      ? "层已写进样式表。暖色 = override 赢了。"
      : "这只浏览器可能不认 @layer。";
  </script>
</body>
</html>
