<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 导入映射</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>HTML import maps 真源在 WHATWG。Node package maps ≠ 这一套。本页只探测 <code>importmap</code> 脚本类型。不是已采用模块栈。</p>
    <p class="st" id="st"></p>
  </main>
  <script>
    const el = document.createElement("script");
    document.getElementById("st").textContent = "script.noModule 可写 · importmap 类型支持看 HTMLScriptElement.supports： " +
      (HTMLScriptElement.supports ? String(HTMLScriptElement.supports("importmap")) : "无 supports()");
  </script>
</body>
</html>
