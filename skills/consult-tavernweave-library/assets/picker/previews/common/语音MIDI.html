<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 语音 / MIDI</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p>语音无 <code>/TR</code> Rec。MIDI 停在 WD。点了才说话。不是已采用语音栈。</p>
    <button type="button" id="go">读一句</button>
    <p class="st" id="st"></p>
  </main>
  <script>
    const st = document.getElementById("st");
    st.textContent = (speechSynthesis ? "有 speechSynthesis。" : "没有语音。") +
      (navigator.requestMIDIAccess ? " 有 MIDI 入口。" : " 无 MIDI。");
    document.getElementById("go").addEventListener("click", () => {
      if (!speechSynthesis) return;
      const u = new SpeechSynthesisUtterance("这不是已采用。");
      u.lang = "zh-CN";
      speechSynthesis.speak(u);
    });
  </script>
</body>
</html>
