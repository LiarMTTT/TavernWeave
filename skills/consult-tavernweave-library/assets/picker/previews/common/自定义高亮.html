<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 自定义高亮</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p { font-size: 13px; line-height: 1.55; max-width: 46em; }
    #src { padding: 12px; background: #1a1d26; border-radius: 8px; }
    ::highlight(demo) { background: #e8b86d; color: #12141a; }
    button { background: #232833; color: inherit; border: 1px solid #2e3440; border-radius: 8px; padding: 6px 10px; }
    .st { color: #9aa3b2; }
    code { color: #7eb8ff; }
  </style>
</head>
<body>
  <main>
    <p><code>CSS.highlights</code> + <code>::highlight()</code> 标一段字，<strong>不</strong>改 DOM。不是 <code>::selection</code>。没有 API 就只显示原文。不是已采用高亮栈。</p>
    <p id="src">蒸馏是为了快筛。把入口收成可点的预览，而不是把规范嵌进来。</p>
    <p class="st" id="st"></p>
    <button type="button" id="go">标「快筛」</button>
  </main>
  <script>
    const src = document.getElementById("src");
    const st = document.getElementById("st");
    const has = CSS.highlights && CSS.Highlight;
    st.textContent = has ? "已检测到 Custom Highlight。" : "没有 Custom Highlight API。";
    document.getElementById("go").addEventListener("click", () => {
      if (!has) return;
      const text = src.firstChild;
      const i = src.textContent.indexOf("快筛");
      if (i < 0) return;
      const range = new Range();
      range.setStart(text, i);
      range.setEnd(text, i + 2);
      CSS.highlights.set("demo", new Highlight(range));
    });
  </script>
</body>
</html>
