<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · 悬停过渡</title>
  <style>
    html, body { margin: 0; background: #12141a; color: #e8eaef; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { padding: 16px 18px 24px; }
    p.copy { font-size: 13px; line-height: 1.55; max-width: 46em; margin: 0 0 14px; }
    code { font-size: 12px; color: #7eb8ff; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    a.btn {
      display: inline-block; padding: 10px 16px; text-decoration: none; color: #e8eaef;
      border: 1px solid #7eb8ff; background: #1a1d26;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }
    a.btn:hover { background: #243044; border-color: #e8b86d; transform: translateY(-2px); }
    a.old {
      display: inline-block; padding: 10px 16px; text-decoration: none; color: #e8eaef;
      background: #1a1d26; border: 1px solid #3a404c;
    }
    a.old:hover { background: #e8b86d; color: #12141a; }
  </style>
</head>
<body>
  <main>
    <p class="copy">左边是 <code>transition</code> 的悬停。右边是瞬间换色，没有过渡——Hover.css 那种预置类过时了，新活优先 CSS transition。这不是已采用按钮皮肤，也不搬 Hover.css。</p>
    <div class="row">
      <a class="btn" href="javascript:void(0)">有过渡</a>
      <a class="old" href="javascript:void(0)">无过渡</a>
    </div>
  </main>
</body>
</html>
